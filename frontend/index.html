<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Chatbot</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-gray-800 shadow-sm border-b border-gray-700 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center">
          <span class="text-white font-bold text-sm">C</span>
        </div>
        <h1 class="text-xl font-semibold text-gray-100">Company Chatbot</h1>
      </div>
    </div>
  </header>

  <!-- Chat -->
  <div class="flex-1 overflow-y-auto px-4 py-6" id="chatcontainer"></div>

  <!-- Input -->
  <div class="bg-gray-800 border-t border-gray-700 px-4 py-4">
    <div class="max-w-4xl mx-auto flex items-end space-x-3">
      <textarea class="w-full resize-none border border-gray-600 rounded-lg px-4 py-3 bg-gray-700 text-gray-100"
        rows="1" id="input" placeholder="Type your message..."></textarea>

      <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg" id="ask">
        Send
      </button>
    </div>
  </div>

  <!-- ✅ FRONTEND API CONFIG -->
  <script>
    // Use same-origin API route by default. This works when the Express server
    // serves both the frontend and backend from the same host.
    window.API_URL = "https://genai-tsy7.onrender.com/api/chat";
  </script>

  <script src="./script.js"></script>
</body>

</html>
